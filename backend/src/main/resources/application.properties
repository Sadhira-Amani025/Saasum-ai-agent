# ==============================================================================
# SaaSsum AI Commerce - Spring Boot Configuration
# ==============================================================================
server.port=8085

# Application Name
spring.application.name=saassum-ai-commerce-backend

# Database Configuration (Defaults to in-memory H2 with PostgreSQL syntax mode for zero-setup demo)
# Override with Supabase PostgreSQL via environment variable SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:saassumdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console if running in embedded mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Configuration (Supports Gemini and OpenAI)
ai.provider=${AI_PROVIDER:gemini}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# JSON serialization
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.indent-output=true
